<head>

<meta name="color-scheme" content="dark" />

<meta name="description" content="Nebula is a zero-backend analytics workbench: load a million rows, filter, group and visualise them at 60fps, entirely in your browser." />

<body>
<div id="app"></div>

<div class="boot" id="boot">
  <div class="boot-in">

    <div class="boot-t">Nebula</div>
    <div class="boot-s" id="bootMsg">initialising engine…</div>

</div>

    <p>Parsed locally in a Web Worker · nothing is uploaded</p>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>

<script type="module" src="/src/main.ts"></script>
